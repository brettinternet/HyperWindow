name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Check release version policy
        run: ./scripts/test-release-version.sh
      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project HyperWindow.xcodeproj \
            -scheme HyperWindow \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS'
          /usr/bin/xcrun swift ./scripts/sign-local-app.swift \
            build/Build/Products/Debug/HyperWindow.app
      - name: Run tests
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building \
            -project HyperWindow.xcodeproj \
            -scheme HyperWindow \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:HyperWindowTests
      - name: Build and verify release app
        run: ./scripts/build-release.sh

  release:
    name: Test and publish universal macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release version policy
        run: ./scripts/test-release-version.sh
      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project HyperWindow.xcodeproj \
            -scheme HyperWindow \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS'
          /usr/bin/xcrun swift ./scripts/sign-local-app.swift \
            build/Build/Products/Debug/HyperWindow.app
      - name: Run tests
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building \
            -project HyperWindow.xcodeproj \
            -scheme HyperWindow \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:HyperWindowTests
      - name: Import signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode -o "$RUNNER_TEMP/developer-id.p12" <<<"$DEVELOPER_ID_P12_BASE64"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          base64 --decode -o "$RUNNER_TEMP/notary-key.p8" <<<"$NOTARY_KEY_P8_BASE64"
      - name: Package, sign, and notarize release
        env:
          DEVELOPER_ID_IDENTITY: "Developer ID Application: Brett Gardiner (4NQM9EVPZ3)"
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Download `HyperWindow-…-macos-universal.dmg` and verify its matching SHA-256 checksum.

            The app is universal arm64/x86_64, Developer ID signed, and notarized by Apple.
        run: |
          source scripts/release-version.sh
          release_version_parse "$GITHUB_REF_NAME"
          release_flags=()
          if [[ "$RELEASE_IS_PRERELEASE" == 1 ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/HyperWindow-${GITHUB_REF_NAME}-macos-universal.dmg#HyperWindow universal macOS DMG" \
            "dist/HyperWindow-${GITHUB_REF_NAME}-macos-universal.dmg.sha256#HyperWindow DMG SHA-256" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            "${release_flags[@]}" \
            --notes "$RELEASE_NOTES" \
            --generate-notes
